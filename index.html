    <script>
      // Gracefully handle Vite HMR WebSocket closed notice in AI Studio preview iframe where HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.preventDefault();
        }
      });
    </script>
